<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極簡代辦事項 TaskMaster</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font - Inter & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
            }
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* 質感動畫與滾動條優化 */
    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }
    .task-item {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .task-item:hover {
      transform: translateY(-2px);
    }
    /* 自訂平滑滾動 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(156, 163, 175, 0.6);
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full flex flex-col transition-colors duration-300">

  <!-- 頂部導覽列 -->
  <header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md sticky top-0 z-20 border-b border-slate-200 dark:border-slate-700">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-sky-500/20">
          <i class="fa-solid font-bold fa-check-double text-lg"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight">TaskMaster</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">高效待辦事項管理</p>
        </div>
      </div>
      
      <div class="flex items-center gap-3">
        <!-- 主題切換按鈕 -->
        <button id="themeToggleBtn" title="切換深色/淺色模式" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors">
          <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl w-full mx-auto px-4 sm:px-6 py-8 flex-1 flex flex-col gap-6">
    
    <!-- 概覽數據看板與進度條 -->
    <section class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700/80">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-3">
        <div>
          <h2 class="text-lg font-semibold text-slate-800 dark:text-white">今日進度概覽</h2>
          <p class="text-sm text-slate-500 dark:text-slate-400" id="progressSummaryText">保持專注，準備完成今天的第一個任務！</p>
        </div>
        <div class="flex items-center gap-4 text-sm font-medium">
          <div class="text-slate-600 dark:text-slate-300">
            已完成 <span id="completedCount" class="font-bold text-sky-600 dark:text-sky-400">0</span> / <span id="totalCount">0</span>
          </div>
        </div>
      </div>
      
      <!-- 進度條 -->
      <div class="w-full bg-slate-100 dark:bg-slate-700 h-3 rounded-full overflow-hidden">
        <div id="progressBar" class="bg-gradient-to-r from-sky-500 to-indigo-500 h-full w-0 transition-all duration-500 rounded-full"></div>
      </div>
    </section>

    <!-- 新增任務表單 -->
    <section class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700/80">
      <form id="taskForm" class="flex flex-col gap-4">
        <div class="flex flex-col sm:flex-row gap-3">
          <input 
            type="text" 
            id="taskTitle" 
            placeholder="今天想完成什麼任務？" 
            required
            class="flex-1 px-4 py-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-sky-500 text-slate-800 dark:text-slate-100 placeholder-slate-400 transition"
          >
          <button 
            type="submit" 
            class="px-6 py-3 bg-sky-600 hover:bg-sky-700 text-white font-medium rounded-xl shadow-md shadow-sky-600/20 active:scale-95 transition flex items-center justify-center gap-2"
          >
            <i class="fa-solid fa-plus"></i>
            <span>新增任務</span>
          </button>
        </div>

        <!-- 任務屬性設定：日期、優先級、分類 -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-sm">
          <!-- 截止日期 -->
          <div>
            <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1 font-medium">截止日期</label>
            <div class="relative">
              <input 
                type="date" 
                id="taskDueDate" 
                class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500"
              >
            </div>
          </div>

          <!-- 優先級 -->
          <div>
            <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1 font-medium">優先級</label>
            <select id="taskPriority" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500">
              <option value="low">🟢 低優先級</option>
              <option value="medium" selected>🟡 中優先級</option>
              <option value="high">🔴 高優先級</option>
            </select>
          </div>

          <!-- 分類 -->
          <div>
            <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1 font-medium">分類標籤</label>
            <select id="taskCategory" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500">
              <option value="Work">💼 工作</option>
              <option value="Personal" selected>👤 個人</option>
              <option value="Study">📚 學習</option>
              <option value="Health">🏋️ 健康</option>
              <option value="Other">🏷️ 其他</option>
            </select>
          </div>
        </div>
      </form>
    </section>

    <!-- 控制面板：搜尋、狀態過濾與分類過濾 -->
    <section class="flex flex-col md:flex-row gap-4 items-stretch md:items-center justify-between">
      
      <!-- 檢視模式與狀態標籤切換 -->
      <div class="flex flex-wrap items-center gap-2">
        <div class="flex bg-slate-200/70 dark:bg-slate-800 p-1 rounded-xl gap-1 text-sm font-medium">
          <button id="viewListBtn" class="view-tab px-3 py-1.5 rounded-lg bg-white dark:bg-slate-700 shadow-sm text-sky-600 dark:text-sky-400 transition" data-view="list">
            <i class="fa-solid fa-list-check mr-1"></i> 清單模式
          </button>
          <button id="viewCalendarBtn" class="view-tab px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition" data-view="calendar">
            <i class="fa-regular fa-calendar-days mr-1"></i> 日曆模式
          </button>
        </div>

        <div class="flex bg-slate-200/70 dark:bg-slate-800 p-1 rounded-xl gap-1 text-sm font-medium">
          <button id="filterAll" class="filter-tab px-3 py-1.5 rounded-lg bg-white dark:bg-slate-700 shadow-sm text-sky-600 dark:text-sky-400 transition" data-status="all">全部</button>
          <button id="filterActive" class="filter-tab px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition" data-status="active">未完成</button>
          <button id="filterCompleted" class="filter-tab px-3 py-1.5 rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition" data-status="completed">已完成</button>
        </div>
      </div>

      <!-- 搜尋與細項過濾工具列 -->
      <div class="flex flex-wrap items-center gap-2 flex-1 md:justify-end">
        <!-- 關鍵字搜尋 -->
        <div class="relative flex-1 sm:w-48 sm:flex-none">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input 
            type="text" 
            id="searchInput" 
            placeholder="搜尋任務..." 
            class="w-full pl-8 pr-3 py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500"
          >
        </div>

        <!-- 優先級篩選 -->
        <select id="priorityFilter" class="py-2 px-3 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500">
          <option value="all">所有優先級</option>
          <option value="high">🔴 高優先級</option>
          <option value="medium">🟡 中優先級</option>
          <option value="low">🟢 低優先級</option>
        </select>

        <!-- 清理已完成按鈕 -->
        <button id="clearCompletedBtn" title="刪除所有已完成任務" class="px-3 py-2 text-sm text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/30 rounded-xl border border-rose-200 dark:border-rose-900/50 transition">
          <i class="fa-regular fa-trash-can mr-1"></i> 清理已完成
        </button>
      </div>
    </section>

    <!-- 台灣國定假日日曆區塊 -->
    <section id="calendarSection" class="hidden bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700/80">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-3">
          <h2 id="calendarMonthYear" class="text-lg font-bold text-slate-800 dark:text-white"></h2>
          <button id="todayBtn" class="px-2.5 py-1 text-xs bg-sky-100 dark:bg-sky-950/60 text-sky-600 dark:text-sky-400 rounded-lg hover:bg-sky-200 dark:hover:bg-sky-900 transition font-medium">回到今天</button>
        </div>
        <div class="flex items-center gap-1">
          <button id="prevMonthBtn" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg text-slate-600 dark:text-slate-300 transition">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <button id="nextMonthBtn" class="p-2 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg text-slate-600 dark:text-slate-300 transition">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      </div>

      <!-- 標示圖例 -->
      <div class="flex flex-wrap items-center gap-4 text-xs mb-3 pb-3 border-b border-slate-100 dark:border-slate-700/60">
        <span class="flex items-center gap-1.5 text-rose-600 dark:text-rose-400 font-semibold">
          <span class="w-3 h-3 rounded-md bg-rose-500 border border-rose-600 inline-block shadow-sm"></span> 🇹🇼 台灣國定假日 (醒目標示)
        </span>
        <span class="flex items-center gap-1.5 text-sky-600 dark:text-sky-400 font-medium">
          <span class="w-3 h-3 rounded-md bg-sky-500 inline-block"></span> 今天
        </span>
        <span class="flex items-center gap-1.5 text-amber-600 dark:text-amber-400 font-medium">
          <span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span> 待辦事項
        </span>
      </div>

      <!-- 星期欄頭 -->
      <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs text-slate-500 dark:text-slate-400 mb-2">
        <div class="text-rose-500">日</div>
        <div>一</div>
        <div>二</div>
        <div>三</div>
        <div>四</div>
        <div>五</div>
        <div class="text-indigo-500">六</div>
      </div>

      <!-- 日曆網格 -->
      <div id="calendarGrid" class="grid grid-cols-7 gap-1.5 text-center"></div>
    </section>

    <!-- 待辦事項清單列表 -->
    <section>
      <ul id="taskList" class="space-y-3">
        <!-- 任務項目動態渲染區塊 -->
      </ul>

      <!-- 空白狀態顯示 (沒有任務時) -->
      <div id="emptyState" class="hidden flex-col items-center justify-center py-12 text-center">
        <div class="w-16 h-16 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 mb-3 text-2xl">
          <i class="fa-regular fa-clipboard"></i>
        </div>
        <h3 class="text-slate-600 dark:text-slate-300 font-medium">沒有找到相關任務</h3>
        <p class="text-slate-400 dark:text-slate-500 text-sm mt-1">試著新增一項任務或調整篩選條件吧！</p>
      </div>
    </section>

  </main>

  <!-- 編輯任務 Modal 彈窗 -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-200">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-200 dark:border-slate-700 transform scale-95 transition-transform duration-200" id="editModalContainer">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-slate-800 dark:text-white">編輯任務</h3>
        <button id="closeEditModalBtn" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>
      <form id="editTaskForm" class="space-y-4">
        <input type="hidden" id="editTaskId">
        <div>
          <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1 font-medium">任務標題</label>
          <input type="text" id="editTaskTitle" required class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>
        
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-sm">
          <div>
            <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1 font-medium">截止日期</label>
            <input type="date" id="editTaskDueDate" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500">
          </div>
          <div>
            <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1 font-medium">優先級</label>
            <select id="editTaskPriority" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500">
              <option value="low">🟢 低優先級</option>
              <option value="medium">🟡 中優先級</option>
              <option value="high">🔴 高優先級</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-500 dark:text-slate-400 mb-1 font-medium">分類標籤</label>
            <select id="editTaskCategory" class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500">
              <option value="Work">💼 工作</option>
              <option value="Personal">👤 個人</option>
              <option value="Study">📚 學習</option>
              <option value="Health">🏋️ 健康</option>
              <option value="Other">🏷️ 其他</option>
            </select>
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="cancelEditBtn" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">取消</button>
          <button type="submit" class="px-4 py-2 bg-sky-600 hover:bg-sky-700 text-white rounded-xl shadow-md transition">儲存修改</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 核心數據結構與狀態管理
    let tasks = [];
    let currentStatusFilter = 'all';
    let currentPriorityFilter = 'all';
    let currentSearchQuery = '';
    let currentView = 'list'; // 'list' | 'calendar'
    let calCurrentDate = new Date(); // 日曆當前顯示年月
    let selectedCalDateStr = null; // 當前日曆點選的日期

    // 台灣國定假日資料庫 (支援固定與彈性節日)
    const twHolidays = {
      // 固定國定假日
      '01-01': '元旦',
      '02-28': '228和平紀念日',
      '04-04': '兒童節/清明節',
      '05-01': '勞動節',
      '10-10': '國慶日',

      // 2025 年農曆及彈性國定假日
      '2025-01-27': '小年夜',
      '2025-01-28': '農曆除夕',
      '2025-01-29': '春節初一',
      '2025-01-30': '春節初二',
      '2025-01-31': '春節初三',
      '2025-05-30': '端午節',
      '2025-10-06': '中秋節',

      // 2026 年農曆及彈性國定假日
      '2026-02-16': '農曆除夕',
      '2026-02-17': '春節初一',
      '2026-02-18': '春節初二',
      '2026-02-19': '春節初三',
      '2026-02-20': '春節補假',
      '2026-04-03': '兒童節補假',
      '2026-06-19': '端午節',
      '2026-09-25': '中秋節',

      // 2027 年農曆及彈性國定假日
      '2027-02-06': '農曆除夕',
      '2027-02-07': '春節初一',
      '2027-02-08': '春節初二',
      '2027-02-09': '春節初三',
      '2027-06-09': '端午節',
      '2027-09-15': '中秋節'
    };

    // DOM 元素引用
    const taskForm = document.getElementById('taskForm');
    const taskTitleInput = document.getElementById('taskTitle');
    const taskDueDateInput = document.getElementById('taskDueDate');
    const taskPriorityInput = document.getElementById('taskPriority');
    const taskCategoryInput = document.getElementById('taskCategory');
    const taskList = document.getElementById('taskList');
    const emptyState = document.getElementById('emptyState');
    
    // 進度條與數據統計 DOM
    const progressBar = document.getElementById('progressBar');
    const completedCountEl = document.getElementById('completedCount');
    const totalCountEl = document.getElementById('totalCount');
    const progressSummaryText = document.getElementById('progressSummaryText');

    // 檢視模式與篩選器 DOM
    const viewListBtn = document.getElementById('viewListBtn');
    const viewCalendarBtn = document.getElementById('viewCalendarBtn');
    const calendarSection = document.getElementById('calendarSection');
    const calendarMonthYear = document.getElementById('calendarMonthYear');
    const calendarGrid = document.getElementById('calendarGrid');
    const prevMonthBtn = document.getElementById('prevMonthBtn');
    const nextMonthBtn = document.getElementById('nextMonthBtn');
    const todayBtn = document.getElementById('todayBtn');

    const filterTabs = document.querySelectorAll('.filter-tab');
    const searchInput = document.getElementById('searchInput');
    const priorityFilter = document.getElementById('priorityFilter');
    const clearCompletedBtn = document.getElementById('clearCompletedBtn');

    // 深色模式 DOM
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');

    // 編輯 Modal DOM
    const editModal = document.getElementById('editModal');
    const editModalContainer = document.getElementById('editModalContainer');
    const editTaskForm = document.getElementById('editTaskForm');
    const editTaskId = document.getElementById('editTaskId');
    const editTaskTitle = document.getElementById('editTaskTitle');
    const editTaskDueDate = document.getElementById('editTaskDueDate');
    const editTaskPriority = document.getElementById('editTaskPriority');
    const editTaskCategory = document.getElementById('editTaskCategory');
    const closeEditModalBtn = document.getElementById('closeEditModalBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');

    // 初始化應用程式
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      loadTasksFromLocalStorage();
      renderTasks();
      renderCalendar();
      
      const today = new Date().toISOString().split('T')[0];
      taskDueDateInput.value = today;
    });

    // 檢視模式切換 (清單 / 日曆)
    viewListBtn.addEventListener('click', () => setViewMode('list'));
    viewCalendarBtn.addEventListener('click', () => setViewMode('calendar'));

    function setViewMode(mode) {
      currentView = mode;
      if (mode === 'calendar') {
        viewCalendarBtn.classList.add('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-sky-600', 'dark:text-sky-400');
        viewCalendarBtn.classList.remove('text-slate-600', 'dark:text-slate-400');
        viewListBtn.classList.remove('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-sky-600', 'dark:text-sky-400');
        viewListBtn.classList.add('text-slate-600', 'dark:text-slate-400');
        calendarSection.classList.remove('hidden');
        renderCalendar();
      } else {
        viewListBtn.classList.add('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-sky-600', 'dark:text-sky-400');
        viewListBtn.classList.remove('text-slate-600', 'dark:text-slate-400');
        viewCalendarBtn.classList.remove('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-sky-600', 'dark:text-sky-400');
        viewCalendarBtn.classList.add('text-slate-600', 'dark:text-slate-400');
        calendarSection.classList.add('hidden');
      }
    }

    // 取得指定日期的國定假日名稱
    function getTaiwanHoliday(year, month, day) {
      const mm = String(month).padStart(2, '0');
      const dd = String(day).padStart(2, '0');
      const fullKey = `${year}-${mm}-${dd}`;
      const shortKey = `${mm}-${dd}`;

      return twHolidays[fullKey] || twHolidays[shortKey] || null;
    }

    // 渲染日曆
    function renderCalendar() {
      const year = calCurrentDate.getFullYear();
      const month = calCurrentDate.getMonth(); // 0-based

      calendarMonthYear.textContent = `${year} 年 ${month + 1} 月`;

      // 取得當月第一天與總天數
      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const prevMonthLastDay = new Date(year, month, 0).getDate();

      const todayStr = new Date().toISOString().split('T')[0];

      let daysHtml = '';

      // 填補上個月尾數
      for (let x = firstDayIndex; x > 0; x--) {
        const pDay = prevMonthLastDay - x + 1;
        daysHtml += `<div class="p-2 min-h-[64px] text-slate-300 dark:text-slate-600 rounded-xl bg-slate-50/50 dark:bg-slate-900/30 text-xs">${pDay}</div>`;
      }

      // 繪製當月日期
      for (let day = 1; day <= totalDays; day++) {
        const mm = String(month + 1).padStart(2, '0');
        const dd = String(day).padStart(2, '0');
        const dateStr = `${year}-${mm}-${dd}`;

        const holidayName = getTaiwanHoliday(year, month + 1, day);
        const isToday = (dateStr === todayStr);
        const isSelected = (dateStr === selectedCalDateStr);

        // 該日期的待辦事項
        const dayTasks = tasks.filter(t => t.dueDate === dateStr);
        const hasUncompleted = dayTasks.some(t => !t.completed);

        // 樣式判定：國定假日醒目紅粉色調
        let cellBgClass = 'bg-slate-50 dark:bg-slate-900/60 hover:bg-slate-100 dark:hover:bg-slate-700/60 text-slate-700 dark:text-slate-200';
        let badgeHtml = '';

        if (holidayName) {
          // 顯眼的台灣國定假日樣式
          cellBgClass = 'bg-rose-100/90 dark:bg-rose-950/70 border-2 border-rose-500 text-rose-800 dark:text-rose-200 font-bold shadow-sm hover:bg-rose-200 dark:hover:bg-rose-900/80';
          badgeHtml = `<span class="mt-1 block text-[10px] bg-rose-500 text-white dark:bg-rose-600 px-1 py-0.5 rounded leading-tight font-medium truncate">${holidayName}</span>`;
        } else if (isToday) {
          cellBgClass = 'bg-sky-50 dark:bg-sky-950/70 border-2 border-sky-500 text-sky-700 dark:text-sky-200 font-bold';
        }

        if (isSelected) {
          cellBgClass += ' ring-2 ring-indigo-500 ring-offset-1 dark:ring-offset-slate-800';
        }

        daysHtml += `
          <div 
            onclick="selectCalendarDate('${dateStr}')" 
            class="p-1.5 min-h-[68px] rounded-xl flex flex-col justify-between items-center cursor-pointer transition-all ${cellBgClass}"
          >
            <div class="flex items-center justify-between w-full px-1">
              <span class="text-xs font-semibold ${holidayName ? 'text-rose-700 dark:text-rose-300' : ''}">${day}</span>
              ${dayTasks.length > 0 ? `<span class="w-2 h-2 rounded-full ${hasUncompleted ? 'bg-amber-500' : 'bg-emerald-500'}"></span>` : ''}
            </div>
            ${badgeHtml}
            ${dayTasks.length > 0 ? `<span class="text-[9px] text-slate-500 dark:text-slate-400">${dayTasks.length} 個任務</span>` : '<span></span>'}
          </div>
        `;
      }

      calendarGrid.innerHTML = daysHtml;
    }

    // 點擊日曆日期：自動帶入新增任務的日期並進行篩選
    function selectCalendarDate(dateStr) {
      selectedCalDateStr = dateStr;
      taskDueDateInput.value = dateStr;
      renderCalendar();
      
      // 自動搜尋或提示該日期任務
      currentSearchQuery = '';
      searchInput.value = '';
      renderTasks();
    }

    // 月份切換控制
    prevMonthBtn.addEventListener('click', () => {
      calCurrentDate.setMonth(calCurrentDate.getMonth() - 1);
      renderCalendar();
    });

    nextMonthBtn.addEventListener('click', () => {
      calCurrentDate.setMonth(calCurrentDate.getMonth() + 1);
      renderCalendar();
    });

    todayBtn.addEventListener('click', () => {
      calCurrentDate = new Date();
      selectedCalDateStr = calCurrentDate.toISOString().split('T')[0];
      taskDueDateInput.value = selectedCalDateStr;
      renderCalendar();
    });

    // 從 LocalStorage 載入資料
    function loadTasksFromLocalStorage() {
      const savedTasks = localStorage.getItem('taskmaster_tasks');
      if (savedTasks) {
        try {
          tasks = JSON.parse(savedTasks);
        } catch (e) {
          console.error('LocalStorage 讀取失敗', e);
          tasks = [];
        }
      } else {
        // 預設範例任務
        tasks = [
          {
            id: '1',
            title: '歡迎使用 TaskMaster！點擊左側勾選框即可完成任務',
            dueDate: new Date().toISOString().split('T')[0],
            priority: 'medium',
            category: 'Personal',
            completed: false,
            createdAt: new Date().toISOString()
          },
          {
            id: '2',
            title: '嘗試新增一項你明天需要完成的事項吧',
            dueDate: '',
            priority: 'high',
            category: 'Work',
            completed: false,
            createdAt: new Date().toISOString()
          }
        ];
        saveTasksToLocalStorage();
      }
    }

    // 儲存資料至 LocalStorage
    function saveTasksToLocalStorage() {
      localStorage.setItem('taskmaster_tasks', JSON.stringify(tasks));
      updateDashboard();
      if (currentView === 'calendar') {
        renderCalendar();
      }
    }

    // 更新數據看板與進度條
    function updateDashboard() {
      const total = tasks.length;
      const completed = tasks.filter(t => t.completed).length;

      if (totalCountEl) totalCountEl.textContent = total;
      if (completedCountEl) completedCountEl.textContent = completed;

      const percentage = total === 0 ? 0 : Math.round((completed / total) * 100);
      if (progressBar) progressBar.style.width = `${percentage}%`;

      if (progressSummaryText) {
        if (total === 0) {
          progressSummaryText.textContent = '保持專注，準備完成今天的第一個任務！';
        } else if (percentage === 100) {
          progressSummaryText.textContent = '🎉 太棒了！所有任務已全部完成！';
        } else {
          progressSummaryText.textContent = `加油！已完成 ${percentage}% 的任務。`;
        }
      }
    }

    // 新增任務
    taskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = taskTitleInput.value.trim();
      if (!title) return;

      const newTask = {
        id: Date.now().toString(),
        title,
        dueDate: taskDueDateInput.value,
        priority: taskPriorityInput.value,
        category: taskCategoryInput.value,
        completed: false,
        createdAt: new Date().toISOString()
      };

      tasks.unshift(newTask);
      saveTasksToLocalStorage();
      renderTasks();
      taskTitleInput.value = '';
    });

    // 切換任務完成狀態
    function toggleTaskStatus(id) {
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.completed = !task.completed;
        saveTasksToLocalStorage();
        renderTasks();
      }
    }

    // 刪除任務
    function deleteTask(id) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasksToLocalStorage();
      renderTasks();
    }

    // 清理所有已完成任務
    clearCompletedBtn.addEventListener('click', () => {
      tasks = tasks.filter(t => !t.completed);
      saveTasksToLocalStorage();
      renderTasks();
    });

    // 開啟編輯 Modal
    function openEditModal(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      editTaskId.value = task.id;
      editTaskTitle.value = task.title;
      editTaskDueDate.value = task.dueDate || '';
      editTaskPriority.value = task.priority;
      editTaskCategory.value = task.category;

      editModal.classList.remove('opacity-0', 'pointer-events-none');
      editModalContainer.classList.remove('scale-95');
    }

    // 關閉編輯 Modal
    function closeEditModal() {
      editModal.classList.add('opacity-0', 'pointer-events-none');
      editModalContainer.classList.add('scale-95');
    }

    closeEditModalBtn.addEventListener('click', closeEditModal);
    cancelEditBtn.addEventListener('click', closeEditModal);

    // 儲存編輯後內容
    editTaskForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = editTaskId.value;
      const task = tasks.find(t => t.id === id);
      if (task) {
        task.title = editTaskTitle.value.trim();
        task.dueDate = editTaskDueDate.value;
        task.priority = editTaskPriority.value;
        task.category = editTaskCategory.value;

        saveTasksToLocalStorage();
        renderTasks();
        closeEditModal();
      }
    });

    // 狀態切換頁籤事件綁定
    filterTabs.forEach(tab => {
      tab.addEventListener('click', () => {
        filterTabs.forEach(t => {
          t.classList.remove('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-sky-600', 'dark:text-sky-400');
          t.classList.add('text-slate-600', 'dark:text-slate-400');
        });

        tab.classList.add('bg-white', 'dark:bg-slate-700', 'shadow-sm', 'text-sky-600', 'dark:text-sky-400');
        tab.classList.remove('text-slate-600', 'dark:text-slate-400');

        currentStatusFilter = tab.getAttribute('data-status');
        renderTasks();
      });
    });

    // 關鍵字與優先級篩選觸發
    searchInput.addEventListener('input', (e) => {
      currentSearchQuery = e.target.value.toLowerCase().trim();
      renderTasks();
    });

    priorityFilter.addEventListener('change', (e) => {
      currentPriorityFilter = e.target.value;
      renderTasks();
    });

    // 渲染待辦清單
    function renderTasks() {
      // 綜合篩選邏輯
      const filteredTasks = tasks.filter(task => {
        // 1. 狀態過濾
        if (currentStatusFilter === 'active' && task.completed) return false;
        if (currentStatusFilter === 'completed' && !task.completed) return false;

        // 2. 優先級過濾
        if (currentPriorityFilter !== 'all' && task.priority !== currentPriorityFilter) return false;

        // 3. 搜尋關鍵字過濾
        if (currentSearchQuery && !task.title.toLowerCase().includes(currentSearchQuery)) return false;

        return true;
      });

      // 顯示/隱藏空白狀態
      if (filteredTasks.length === 0) {
        taskList.innerHTML = '';
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
      } else {
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');
      }

      // 繪製清單內容
      taskList.innerHTML = filteredTasks.map(task => {
        // 優先級樣式標籤
        const priorityBadgeMap = {
          high: '<span class="px-2 py-0.5 text-xs font-semibold rounded-md bg-rose-100 dark:bg-rose-950/50 text-rose-600 dark:text-rose-400">高</span>',
          medium: '<span class="px-2 py-0.5 text-xs font-semibold rounded-md bg-amber-100 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400">中</span>',
          low: '<span class="px-2 py-0.5 text-xs font-semibold rounded-md bg-emerald-100 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400">低</span>'
        };

        // 分類對應圖示/名稱
        const categoryMap = {
          Work: '💼 工作',
          Personal: '👤 個人',
          Study: '📚 學習',
          Health: '🏋️ 健康',
          Other: '🏷️ 其他'
        };

        const isCompleted = task.completed;
        
        return `
          <li class="task-item bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700/80 flex items-center justify-between gap-3 ${isCompleted ? 'opacity-65' : ''}">
            <!-- 勾選框與主要標題 -->
            <div class="flex items-start sm:items-center gap-3 flex-1 min-w-0">
              <button 
                onclick="toggleTaskStatus('${task.id}')"
                class="mt-1 sm:mt-0 w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-colors flex-shrink-0 ${
                  isCompleted 
                    ? 'bg-sky-500 border-sky-500 text-white' 
                    : 'border-slate-300 dark:border-slate-600 hover:border-sky-500'
                }"
              >
                ${isCompleted ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
              </button>

              <div class="flex-1 min-w-0">
                <p class="text-slate-800 dark:text-slate-100 font-medium break-words leading-snug ${isCompleted ? 'line-through text-slate-400 dark:text-slate-500' : ''}">
                  ${escapeHtml(task.title)}
                </p>
                
                <!-- 標籤與日期屬性列 -->
                <div class="flex flex-wrap items-center gap-2 mt-1.5 text-xs text-slate-500 dark:text-slate-400">
                  ${priorityBadgeMap[task.priority] || ''}
                  
                  <span class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                    ${categoryMap[task.category] || task.category}
                  </span>

                  ${task.dueDate ? `
                    <span class="flex items-center gap-1 ${isOverdue(task.dueDate) && !isCompleted ? 'text-rose-500 dark:text-rose-400 font-medium' : ''}">
                      <i class="fa-regular fa-calendar text-xs"></i>
                      ${task.dueDate} ${isOverdue(task.dueDate) && !isCompleted ? '(已逾期)' : ''}
                    </span>
                  ` : ''}
                </div>
              </div>
            </div>

            <!-- 操作按鈕 (編輯 & 刪除) -->
            <div class="flex items-center gap-1">
              <button 
                onclick="openEditModal('${task.id}')" 
                title="編輯任務" 
                class="p-2 text-slate-400 hover:text-sky-600 dark:hover:text-sky-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition"
              >
                <i class="fa-regular fa-pen-to-square"></i>
              </button>
              <button 
                onclick="deleteTask('${task.id}')" 
                title="刪除任務" 
                class="p-2 text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition"
              >
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </div>
          </li>
        `;
      }).join('');
    }

    // 檢查日期是否逾期
    function isOverdue(dueDateStr) {
      if (!dueDateStr) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const dueDate = new Date(dueDateStr);
      return dueDate < today;
    }

    // 防止 XSS 攻擊的轉義處理
    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    // 深色模式初始化與切換
    function initTheme() {
      const savedTheme = localStorage.getItem('taskmaster_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
        themeIcon.className = 'fa-solid fa-sun';
      } else {
        document.documentElement.classList.remove('dark');
        themeIcon.className = 'fa-solid fa-moon';
      }
    }

    themeToggleBtn.addEventListener('click', () => {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('taskmaster_theme', isDark ? 'dark' : 'light');
      themeIcon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
    });
  </script>
</body>
</html>
